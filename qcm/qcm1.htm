var Status = new Array();

function CreateStatusArrays() {

    for (var x = 0; x < I.length; x++) {

        Status[x] = new Array();

        Status[x][0] = 0;

        Status[x][1] = new Array();

        for (var y = 0; y < I[x][1].length; y++) {
            Status[x][1][y] = "0";
        }

        Status[x][2] = 0;
        Status[x][3] = 0;
    }
}

function StartUp() {

/* =========================================================
   DISPLAY
   ========================================================= */

function ShowAllQs() {

    var output = "";

    for (var i = 0; i < I.length; i++) {

        output += BuildQuestion(i);

        if (i < I.length - 1) {
            output += "<hr>";
        }
    }

    document.getElementById("quiz").innerHTML = output;
}


function BuildQuestion(QNum) {

    var output = "";

    output += '<div class="question">';

    output +=
        '<span class="question-number">' +
        (QNum + 1) +
        '.</span>';

    output +=
        '<span class="question-text">' +
        I[QNum][0] +
        '</span>';

    for (var i = 0; i < I[QNum][1].length; i++) {

        output +=
            '<div class="answer">';

        output +=
            '<input type="text" id="FB_' +
            QNum + '_' + i +
            '" value=" " readonly>';

        output +=
            '<button type="button" onclick="CheckAnswer(' +
            QNum + ',' + i + ')">' +
            String.fromCharCode(65 + i) +
            '</button>';

        output +=
            '<span class="answer-text">' +
            I[QNum][1][i][0] +
            '</span>';

        output += '</div>';
    }

    output += '</div>';

    return output;
}


/* =========================================================
   ANSWERS
   ========================================================= */

function CheckAnswer(QNum, ANum) {

    var Output = I[QNum][1][ANum][1];

    if (Output == "") {

        if (I[QNum][1][ANum][2] == 1) {
            Output = DefaultRight;
        } else {
            Output = DefaultWrong;
        }
    }


    if (Status[QNum][0] == 0) {

        if (I[QNum][1][ANum][2] == 1) {

            Status[QNum][0] = 1;

            Status[QNum][1][ANum] = "R";

            MarkAnswer(QNum, ANum, true);


            var PossibleWrongs = 0;

            for (
                var i = 0;
                i < I[QNum][1].length;
                i++
            ) {

                if (I[QNum][1][i][2] == 0) {
                    PossibleWrongs++;
                }
            }

            if (PossibleWrongs == 0) {
                PossibleWrongs = 1;
            }

            Status[QNum][3] =
                1 -
                (Status[QNum][2] / PossibleWrongs);

            if (Status[QNum][3] < 0) {
                Status[QNum][3] = 0;
            }

        } else {

            if (Status[QNum][1][ANum] != "W") {

                Status[QNum][1][ANum] = "W";

                MarkAnswer(QNum, ANum, false);

                Status[QNum][2]++;
            }
        }
    }


    var Finished = true;

    for (var i = 0; i < Status.length; i++) {

        if (Status[i][0] == 0) {
            Finished = false;
        }
    }


    if (Status[QNum][0] == 1) {

        var DoneQs = 0;
        var TotalScore = 0;

        for (var i = 0; i < Status.length; i++) {

            if (Status[i][0] == 1) {

                DoneQs++;

                TotalScore += Status[i][3];
            }
        }

        if (DoneQs > 0) {

            Score =
                Math.floor(
                    100 * (TotalScore / DoneQs)
                );
        }

        Output +=
            "<br>" +
            YourScoreIs +
            " " +
            Score +
            "%.";


        if (Finished == true) {

            var CFT = 0;

            for (var i = 0; i < I.length; i++) {

                if (Status[i][2] == 0) {
                    CFT++;
                }
            }

            Output +=
                "<br>" +
                CorrectFirstTime +
                CFT +
                "/" +
                I.length;
        }
    }


    WriteFeedback(Output);
}


function MarkAnswer(QNum, ANum, Right) {

    var box =
        document.getElementById(
            "FB_" + QNum + "_" + ANum
        );

    if (box == null) {
        return;
    }

    if (Right == true) {

        box.value = CorrectIndicator;
        box.className = "correct";

    } else {

        box.value = IncorrectIndicator;
        box.className = "incorrect";
    }
}
