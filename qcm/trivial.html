/* =========================================================
   QUIZ STATUS
   ========================================================= */

var Status = new Array();

function CreateStatusArrays() {

    Status.length = 0;

    for (var i = 0; i < I.length; i++) {

        Status[i] = new Array();

        Status[i][0] = 0;
        Status[i][1] = 0;
        Status[i][2] = 0;
        Status[i][3] = "";
        Status[i][4] = 0;
    }
}


/* =========================================================
   SHUFFLE
   ========================================================= */

function Shuffle(InArray) {

    var Temp = new Array();

    for (var i = 0; i < InArray.length; i++) {
        Temp[i] = InArray[i];
    }

    for (var i = 0; i < InArray.length; i++) {

        var Num =
            Math.floor(
                (InArray.length - i) * Math.random()
            );

        InArray[i] = Temp[Num];

        Temp.splice(Num, 1);
    }

    return InArray;
}


/* =========================================================
   START
   ========================================================= */

function StartUp() {

    if (ShuffleQs == true) {
        I = Shuffle(I);
    }

    CreateStatusArrays();

    document.getElementById("title").innerHTML =
        ExerciseTitle;

    ShowAllQs();

    /* The instruction is displayed only once here. */
    WriteFeedback(Instructions);
}


/* =========================================================
   DISPLAY ALL QUESTIONS
   ========================================================= */

function ShowAllQs() {

    var output = "";

    for (var i = 0; i < I.length; i++) {

        output += BuildQuestion(i);

        if (i < I.length - 1) {
            output += "<hr>";
        }
    }

    document.getElementById("quiz").innerHTML = output;
}


function BuildQuestion(QNum) {

    var output = "";

    output += '<div class="question">';

    output +=
        '<span class="question-number">' +
        (QNum + 1) +
        '.</span>';

    output +=
        '<span class="question-text">' +
        I[QNum][0] +
        '</span>';

    output +=
        '<div class="answer-area">';

    output +=
        '<input type="text" class="answer-box" ' +
        'id="Answer_' + QNum + '" ' +
        'onkeydown="HandleEnter(event,' + QNum + ')">';

    output +=
        '<button type="button" class="quiz-button" ' +
        'onclick="CheckAnswer(false,' + QNum + ')">' +
        'Check' +
        '</button>';

    output +=
        '<button type="button" class="quiz-button" ' +
        'onclick="CheckAnswer(true,' + QNum + ')">' +
        'Hint' +
        '</button>';

    output += '</div>';

    output += '</div>';

    return output;
}


/* =========================================================
   ENTER KEY
   ========================================================= */

function HandleEnter(event, QNum) {

    if (event.key === "Enter") {

        event.preventDefault();

        CheckAnswer(false, QNum);
    }
}


/* =========================================================
   CHECK ANSWER
   ========================================================= */

function CheckAnswer(ShowHint, QNum) {

    if (Status[QNum][0] == 1) {
        ShowAnswers(QNum);
        return;
    }

    var Box =
        document.getElementById("Answer_" + QNum);

    var Guess =
        Box.value.trim();

    Status[QNum][3] = Guess;

    if (Guess.length < 1) {

        WriteFeedback(EnterGuess);

        Box.focus();

        return;
    }

    var TestGuess = Guess;

    if (CaseSensitive == false) {
        TestGuess = TestGuess.toUpperCase();
    }

    var Right = -1;

    for (
        var i = 0;
        i < I[QNum][1].length;
        i++
    ) {

        var Answer = I[QNum][1][i][0];

        var TestAnswer = Answer;

        if (CaseSensitive == false) {
            TestAnswer = TestAnswer.toUpperCase();
        }

        if (TestGuess == TestAnswer) {
            Right = i;
            break;
        }
    }


    /* -----------------------------------------------------
       CORRECT
       ----------------------------------------------------- */

    if (Right > -1) {

        Status[QNum][0] = 1;

        var HintPenalty =
            (Status[QNum][2] * 10) /
            I[QNum][1][Right][0].length;

        Status[QNum][4] =
            Math.floor(
                (10 - Status[QNum][1]) -
                HintPenalty
            );

        if (Status[QNum][4] < 0) {
            Status[QNum][4] = 0;
        }

        var Output =
            '<span class="correct">' +
            CorrectResponse +
            '</span>';

        var OtherAnswers = "";

        for (
            var j = 0;
            j < I[QNum][1].length;
            j++
        ) {

            if (j != Right) {

                OtherAnswers +=
                    I[QNum][1][j][0] +
                    "<br>";
            }
        }

        if (OtherAnswers.length > 0) {

            Output +=
                "<br>" +
                TheseAnswersToo +
                "<br>" +
                OtherAnswers;
        }


        var Finished = true;

        for (var k = 0; k < Status.length; k++) {

            if (Status[k][0] == 0) {
                Finished = false;
                break;
            }
        }


        if (ContinuousScoring == true ||
            Finished == true) {

            var CurrentScore =
                CalculateScore();

            Output +=
                "<br>" +
                YourScoreIs +
                CurrentScore +
                "%.";
        }


        if (Finished == true) {

            var CFT = 0;

            for (
                var m = 0;
                m < Status.length;
                m++
            ) {

                if (
                    Status[m][1] == 0 &&
                    Status[m][2] == 0
                ) {

                    CFT++;
                }
            }

            Output +=
                "<br>" +
                CorrectFirstTime +
                CFT +
                "/" +
                I.length;
        }

        WriteFeedback(Output);

        if (QNum < I.length - 1) {

            var NextBox =
                document.getElementById(
                    "Answer_" + (QNum + 1)
                );

            if (NextBox != null &&
                FocusBoxes == true) {

                NextBox.focus();
            }
        }

        return;
    }


    /* -----------------------------------------------------
       INCORRECT / HINT
       ----------------------------------------------------- */

    if (ShowHint == false) {

        Status[QNum][1]++;

        WriteFeedback(
            '<span class="incorrect">' +
            IncorrectResponse +
            '</span>'
        );

    } else {

        Status[QNum][2]++;

        var CorrectAnswer =
            I[QNum][1][0][0];

        var HintPosition =
            Status[QNum][2] - 1;

        if (HintPosition >= CorrectAnswer.length) {
            HintPosition = CorrectAnswer.length - 1;
        }

        var HintText =
            CorrectAnswer.substring(
                0,
                HintPosition + 1
            );

        WriteFeedback(
            GiveHint +
            '<span class="hint">' +
            HintText +
            '...</span>'
        );
    }

    Box.focus();
}


/* =========================================================
   SCORE
   ========================================================= */

function CalculateScore() {

    var TotalScore = 0;
    var DoneQs = 0;

    for (var i = 0; i < Status.length; i++) {

        if (Status[i][0] == 1) {

            TotalScore += Status[i][4];

            DoneQs++;
        }
    }

    if (DoneQs == 0) {
        return 0;
    }

    return Math.floor(
        (TotalScore * 100) /
        (DoneQs * 10)
    );
}


/* =========================================================
   SHOW ANSWERS
   ========================================================= */

function ShowAnswers(QNum) {

    Status[QNum][0] = 1;

    Status[QNum][1] = -1;
    Status[QNum][2] = -1;
    Status[QNum][4] = 0;

    var Output =
        TheseCorrect +
        "<br>";

    for (
        var i = 0;
        i < I[QNum][1].length;
        i++
    ) {

        Output +=
            I[QNum][1][i][0] +
            "<br>";
    }

    Output +=
        YourScoreIs +
        CalculateScore() +
        "%.";

    WriteFeedback(Output);
}
