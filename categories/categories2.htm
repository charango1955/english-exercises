<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Categories 2</title>

<style>
body {
    background-color: #000000;
    color: #ff8040;
    font-family: Arial, Geneva, sans-serif;
    margin: 0;
    padding: 0;
}

#navigation {
    text-align: center;
    margin-top: 15px;
    margin-bottom: 25px;
    font-size: 16px;
}

#navigation a {
    color: #ff8040;
    text-decoration: none;
}

#navigation a:hover {
    color: #ffff00;
}

.nav-space {
    display: inline-block;
    width: 35px;
}

h1 {
    color: #ffff00;
    font-size: 22px;
    text-align: center;
    margin: 10px 0 5px 0;
}

.subtitle {
    color: #ffff00;
    font-size: 14px;
    text-align: center;
    margin-bottom: 25px;
}

.exercise {
    margin: 0 auto;
    width: 650px;
}

table {
    border-collapse: separate;
    border-spacing: 0 8px;
    margin: 0 auto;
}

td {
    vertical-align: middle;
}

.question {
    color: #ff8040;
    font-weight: normal;
    text-align: right;
    padding-right: 45px;
    white-space: nowrap;
}

.answer {
    text-align: left;
}

.answer select {
    font-size: 14px;
    min-width: 250px;
}

.mark {
    color: #ff8040;
    padding-left: 12px;
    font-weight: normal;
}

.check {
    text-align: center;
    padding-top: 18px;
}

.check input {
    font-size: 14px;
    padding: 3px 12px;
}

#feedback {
    text-align: center;
    color: #ff8040;
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 10px;
}
</style>

<script type="text/javascript">

var CorrectAnswers = [
    5, 1, 8, 6, 10, 2, 4, 7, 3, 9
];

var options = [
    "bear",
    "apartment",
    "English",
    "yellow",
    "potato",
    "table",
    "train",
    "iron",
    "teacher",
    "shirt"
];

var categories = [
    "vegetable",
    "animal",
    "metal",
    "furniture",
    "clothing",
    "housing",
    "colour",
    "vehicle",
    "language",
    "job"
];

var Status = [];
var Penalties = 0;

function StartUp() {

    for (var i = 0; i < categories.length; i++) {
        Status[i] = {
            correct: false,
            tried: false
        };
    }

    BuildExercise();
}

function BuildExercise() {

    var html = "";

    html += '<table>';

    for (var i = 0; i < categories.length; i++) {

        html += '<tr>';

        html += '<td class="question">';
        html += categories[i];
        html += '</td>';

        html += '<td class="answer">';

        if (Status[i].correct) {

            html += options[CorrectAnswers[i] - 1];

        } else {

            html += '<select id="answer' + i + '">';
            html += '<option value="">choose a word</option>';

            for (var j = 0; j < options.length; j++) {

                html += '<option value="' + options[j] + '">';
                html += options[j];
                html += '</option>';
            }

            html += '</select>';
        }

        html += '</td>';

        html += '<td class="mark">';

        if (Status[i].tried) {

            if (Status[i].correct) {
                html += ':)';
            } else {
                html += ':(';
            }
        }

        html += '</td>';

        html += '</tr>';
    }

    html += '<tr>';
    html += '<td colspan="3" class="check">';
    html += '<input type="button" value="Check Answer" onclick="CheckAnswer()">';
    html += '</td>';
    html += '</tr>';

    html += '</table>';

    document.getElementById("exercise").innerHTML = html;
}

function CheckAnswer() {

    var totalCorrect = 0;
    var allDone = true;

    for (var i = 0; i < categories.length; i++) {

        if (Status[i].correct) {
            totalCorrect++;
            continue;
        }

        var select = document.getElementById("answer" + i);

        if (!select) {
            continue;
        }

        Status[i].tried = true;

        var correctWord = options[CorrectAnswers[i] - 1];

        if (select.value === correctWord) {

            Status[i].correct = true;
            totalCorrect++;

        } else {

            allDone = false;
        }
    }

    var score = Math.floor(
        ((totalCorrect - Penalties) / categories.length) * 100
    );

    if (score < 0) {
        score = 0;
    }

    if (allDone) {

        document.getElementById("feedback").innerHTML =
            "Correct! Well done.<br>Your score is " + score + "%.";

    } else {

        document.getElementById("feedback").innerHTML =
            "Sorry! Try again.<br>Your score is " + score + "%.";

        Penalties++;
    }

    BuildExercise();
}

window.onload = StartUp;

</script>
</head>

<body>

<div id="navigation">

    <a href="categories1.htm">&lt;</a>

    <span class="nav-space"></span>

    <a href="../index.html">INDEX</a>

    <span class="nav-space"></span>

    <a href="categories3.htm">&gt;</a>

</div>

<h1>Categories 2</h1>

<div class="subtitle">
    Match the categories
</div>

<div id="feedback"></div>

<div id="exercise" class="exercise"></div>

</body>
</html>
