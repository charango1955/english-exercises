<script type="text/javascript">

var CorrectAnswers = new Array();

CorrectAnswers[0] = 7;
CorrectAnswers[1] = 3;
CorrectAnswers[2] = 8;

CorrectAnswers[4] = 2;
CorrectAnswers[5] = 9;
CorrectAnswers[6] = 4;
CorrectAnswers[7] = 1;
CorrectAnswers[8] = 10;
CorrectAnswers[9] = 6;

var rightchar = ':)';
var wrongchar = ':(';

function CheckAnswer() {

    var TotalCorrect = 0;

    for (var i = 0; i < CorrectAnswers.length; i++) {

        if (document.QuizForm.elements[i * 2].selectedIndex == CorrectAnswers[i]) {

            document.QuizForm.elements[(i * 2) + 1].value = rightchar;

            TotalCorrect++;
        }

        else {

            document.QuizForm.elements[(i * 2) + 1].value = wrongchar;
        }
    }

    var Score = Math.floor(
        (TotalCorrect * 100) / CorrectAnswers.length
    );

    document.CheckForm.ScoreBox.value = Score + '%';
}

</script>
