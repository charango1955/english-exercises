<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proverbs & Expressions 2</title>

<style>
body {
    background-color: #000000;
    color: #ff8040;
    font-family: Arial, Geneva, sans-serif;
    margin: 0;
    padding: 0;
}

.container {
    width: 85%;
    margin: 0 auto;
    text-align: center;
}

/* Navigation */
.navigation {
    padding-top: 15px;
    padding-bottom: 25px;
    font-size: 14px;
}

.navigation a {
    color: #ff8040;
    text-decoration: none;
    margin: 0 18px;
}

.navigation a:hover {
    text-decoration: underline;
}

/* Title */
.title {
    color: #ffff00;
    font-size: 22px;
    margin-bottom: 5px;
}

.subtitle {
    color: #ffff00;
    font-size: 14px;
    margin-bottom: 30px;
}

/* Exercise */
.exercise {
    margin: 0 auto;
    border-collapse: collapse;
}

.exercise td {
    padding: 8px 0;
    vertical-align: middle;
}

/* Space between English expression and answer box */
.left {
    text-align: right;
    padding-right: 35px !important;
    white-space: nowrap;
}

.right {
    text-align: left;
    padding-left: 10px !important;
}

.answer {
    font-family: Arial, Geneva, sans-serif;
    font-size: 14px;
}

.mark {
    padding-left: 12px !important;
    text-align: left;
}

.check {
    padding-top: 25px !important;
}

button {
    font-family: Arial, Geneva, sans-serif;
    font-size: 14px;
    padding: 3px 12px;
}

select {
    font-family: Arial, Geneva, sans-serif;
    font-size: 14px;
}

.feedback {
    margin-top: 20px;
    color: #ff8040;
    font-size: 14px;
}
</style>

<script>

const items = [
    ["to let the cat out of the bag", "révéler un secret"],
    ["to make a living", "gagner sa vie"],
    ["to make ends meet", "joindre les deux bouts"],
    ["to make the most of sth", "tirer le meilleur parti de qqchose"],
    ["to pull someone's leg", "faire 'marcher' quelqu'un"],
    ["to put something right", "remettre les choses en ordre"],
    ["to rack one's brains", "se creuser la tête"],
    ["it rings a bell", "ça me dit quelque chose"],
    ["to see life through rose-coloured spectacles", "voir la vie en rose"],
    ["to toe the line", "être docile"]
];

let answers = [];
let attempts = 0;

function shuffle(array) {

    let result = [...array];

    for (let i = result.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [result[i], result[j]] =
        [result[j], result[i]];
    }

    return result;
}

function startExercise() {

    answers = shuffle(
        items.map((item, index) => ({
            text: item[1],
            index: index
        }))
    );

    buildExercise();
}

function buildExercise() {

    const table =
        document.getElementById("exercise");

    table.innerHTML = "";

    items.forEach((item, index) => {

        const row = table.insertRow();

        /* English expression */

        const leftCell = row.insertCell();

        leftCell.className = "left";

        leftCell.innerHTML = item[0];

        /* Answer box */

        const rightCell = row.insertCell();

        rightCell.className = "right";

        const select =
            document.createElement("select");

        select.className = "answer";

        select.id = "answer" + index;

        const firstOption =
            document.createElement("option");

        firstOption.value = "";

        firstOption.textContent = "???";

        select.appendChild(firstOption);

        answers.forEach(answer => {

            const option =
                document.createElement("option");

            option.value = answer.index;

            option.textContent = answer.text;

            select.appendChild(option);
        });

        rightCell.appendChild(select);

        /* Correct / incorrect mark */

        const markCell = row.insertCell();

        markCell.className = "mark";

        markCell.id = "mark" + index;
    });

    /* Check button */

    const row = table.insertRow();

    const cell = row.insertCell();

    cell.colSpan = 3;

    cell.className = "check";

    const button =
        document.createElement("button");

    button.textContent = "Check";

    button.onclick = checkAnswers;

    cell.appendChild(button);
}

function checkAnswers() {

    attempts++;

    let correct = 0;

    items.forEach((item, index) => {

        const select =
            document.getElementById("answer" + index);

        const mark =
            document.getElementById("mark" + index);

        if (parseInt(select.value) === index) {

            correct++;

            mark.innerHTML = ":-)";

        } else {

            mark.innerHTML = "X";
        }
    });

    const score =
        Math.floor(
            (correct / items.length) * 100
        );

    const feedback =
        document.getElementById("feedback");

    if (correct === items.length) {

        feedback.innerHTML =
            "Correct! Well done.<br>" +
            "Your score is " +
            score + "%.";

    } else {

        feedback.innerHTML =
            "Sorry! Try again.<br>" +
            "Your score is " +
            score + "%.";
    }
}

window.onload = startExercise;

</script>

</head>

<body>

<div class="container">

    <!-- Navigation -->

    <div class="navigation">

        <a href="proverbs1.htm">←</a>

        <a href="../index.html">INDEX</a>

        <a href="proverbs3.htm">→</a>

    </div>

    <!-- Title -->

    <div class="title">
        Proverbs & Expressions 2
    </div>

    <div class="subtitle">
        Matching exercise
    </div>

    <!-- Feedback -->

    <div id="feedback" class="feedback">
    </div>

    <!-- Exercise -->

    <table id="exercise" class="exercise">
    </table>

</div>

</body>
</html>
