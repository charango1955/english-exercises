// BrowserCheck Object

function BrowserCheck() {
	var b = navigator.appName
	this.mac = (navigator.appVersion.indexOf('Mac') != -1)

	if (b=="Netscape") this.b = "ns"
	else if (b=="Microsoft Internet Explorer") this.b = "ie"
	else this.b = b

	this.version = navigator.appVersion
	this.v = parseInt(this.version)

	this.ns = (this.b=="ns" && this.v>=4)
	this.ns4 = (this.b=="ns" && this.v==4)
	this.ns5 = (this.b=="ns" && this.v==5)
	this.ie = (this.b=="ie" && this.v>=4)
	this.ie4 = (this.version.indexOf('MSIE 4')>0)
	this.ie5 = (this.version.indexOf('MSIE 5')>0)
	this.min = (this.ns||this.ie)
	this.CRAPBrowser = (this.ie && this.mac);
}

var LocFolder = GetFolder(window.location.href);

function GetFolder(LocPath){
	LocPath = ReplaceStuff('\'','%27',LocPath);
	var i = LocPath.lastIndexOf('/');
	if (i<0){i=LocPath.lastIndexOf('\\')};
	return LocPath.substring(0,i);
}

function CombineURLs(InURL){
	var i = InURL.indexOf('../');
	var s = LocFolder;

	while (i >- 1){
		s = GetFolder(s);
		InURL = InURL.substring(3,InURL.length);
		i = InURL.indexOf('../');
	}

	return s + '/' + InURL;
}

x = new Array();

function ResolveURLs(InText,Attribute){
	x.length=0;

	var Temp = InText.toLowerCase();
	var z;
	var AttLen = Attribute.length + 2;
	var y=Temp.lastIndexOf(Attribute + '="');

	while (y>-1){
		var sLoc = y+AttLen;

		if (Temp.substring(sLoc,sLoc+5) != 'http:'){
			x[x.length]=new Array();
			x[x.length-1][0] = sLoc;
			z = Temp.indexOf('"',sLoc);
			x[x.length-1][1] = z;
			x[x.length-1][2] = InText.substring(sLoc,z);
		}

		Temp = Temp.substring(0,y);
		y=Temp.lastIndexOf(Attribute + '="');
	}

	for (var j=0; j<x.length; j++){
		InText = InText.substring(0,x[j][0]) +
		CombineURLs(x[j][2]) +
		InText.substring(x[j][1], InText.length);
	}

	return InText;
}

function ResolveAllURLs(Stuff){
	Stuff = ResolveURLs(Stuff,'href');
	Stuff = ResolveURLs(Stuff,'src');
	Stuff = ResolveURLs(Stuff,'parent.location');
	return Stuff;
}

function Shuffle(InArray){

	Temp = new Array();
	var Len = InArray.length;
	var j = Len;

	for (var i=0; i<Len; i++){
		Temp[i] = InArray[i];
	}

	for (i=0; i<Len; i++){

		Num = Math.floor(j * Math.random());

		InArray[i] = Temp[Num];

		for (var k=Num; k < j; k++) {
			Temp[k] = Temp[k+1];
		}

		j--;
	}

	return InArray;
}

function StartUp(){

	CorrectIndicator = '<nobr>' + CorrectIndicator + '</nobr>';
	IncorrectIndicator = '<nobr>' + IncorrectIndicator + '</nobr>';

	WriteFeedback('');

	var DuplicateItem = false;

	for (var i=0; i<I.length; i++){

		if (I[i][2] < 1){

			if (I[i][0].length > 0){
				TotalUnfixedLeftItems++;
			}

			DuplicateItem = false;

			for (var j=0; j<RItems.length; j++){

				if (I[i][1] == RItems[j][0]){

					DuplicateItem = true;

					RItems[j][1][RItems[j][1].length] = i;
				}
			}

			if (DuplicateItem == false){

				RItems[RItems.length] = new Array();

				RItems[RItems.length-1][0] = I[i][1];

				RItems[RItems.length-1][1] = new Array();

				RItems[RItems.length-1][1][0] = i;
			}
		}
	}

	RItems = Shuffle(RItems);


	for (i=0; i<RItems.length; i++){

		for (j=0; j<RItems[i][1].length; j++){

			I[RItems[i][1][j]][3] = i;
		}
	}


	BuildSelector();

	CreateStatusArrays();

	BuildExercise();

	DisplayExercise(Exercise);
}

				);

			}
			else{

				TempRow =
				ReplaceStuff(
					'[strRightItem]',
					I[i][1],
					TempRow
				);
			}


			if ((I[i][2] < 1)&&(Status[i][1] > 0)){

				if (Status[i][0] < 1){

					TempRow =
					ReplaceStuff(
						'[Mark]',
						IncorrectIndicator,
						TempRow
					);

				}
				else{

					TempRow =
					ReplaceStuff(
						'[Mark]',
						CorrectIndicator,
						TempRow
					);
				}

			}
			else{

				TempRow =
				ReplaceStuff(
					'[Mark]',
					'',
					TempRow
				);
			}


			TempRow =
			ReplaceStuff(
				'[INum]',
				i,
				TempRow
			);

			Exercise += TempRow;
		}
	}


	Exercise += CheckButton;

	Exercise =
	TableOpener +
	Exercise +
	TableCloser;
}

function ReplaceStuff(Token, Replacement, InString){

	var i = InString.indexOf(Token);

	var FirstBit = '';
	var LastBit = '';

	while (i>-1){

		FirstBit = InString.substring(0, i);

		LastBit =
		InString.substring(
			i + Token.length,
			InString.length
		);

		InString =
		FirstBit +
		Replacement +
		LastBit;

		i = InString.indexOf(Token);
	}

	return InString;
}


function EscapeDoubleQuotes(InString){

	var Result = '';

	for (var i=0; i<InString.length; i++){

		if (InString.charAt(i) == '"'){
			Result += '&quot;';
		}
		else{
			Result += InString.charAt(i);
		}
	}

	return Result;
}

function GetAnswer(INum){

	var Result = -1;

	var s =
	eval(
		'BottomFrame.document.QForm.sel' +
		INum
	);

	if (s != null){
		Result = s.selectedIndex - 1;
	}

	return Result;
}


function CheckAnswers(){

	var AllDone = true;

	TotCorrectChoices = 0;


	for (var i=0; i<I.length; i++){

		if ((I[i][2] < 1)&&(I[i][0].length > 0)){

			if (Status[i][0] < 1){

				Status[i][1]++;


				if (GetAnswer(i) == I[i][3]){

					Status[i][0] = 1;

				}
				else{

					AllDone = false;
				}
			}


			if (Status[i][0] == 1){

				TotCorrectChoices++;
			}
		}
	}


	var Score =
	Math.floor(
		((TotCorrectChoices-Penalties) /
		TotalUnfixedLeftItems) * 100
	);

	var Feedback = '';


	if (AllDone == true){

		Feedback =
		CorrectResponse +
		'<br />' +
		YourScoreIs +
		Score +
		'%.';

	}
	else{

		Feedback =
		IncorrectResponse +
		'<br />' +
		YourScoreIs +
		Score +
		'%.';

		Penalties++;
	}


	BuildExercise();

	DisplayExercise(Exercise);
}
