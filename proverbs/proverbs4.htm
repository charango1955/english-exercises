<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proverbs & Expressions 4</title>

<style>
body {
    background-color: #000000;
    color: #ff8040;
    font-family: Arial, Geneva, sans-serif;
    margin: 0;
    padding: 0;
}

.container {
    width: 85%;
    margin: 0 auto;
    text-align: center;
}

/* Navigation */
.navigation {
    padding-top: 15px;
    padding-bottom: 25px;
    font-size: 14px;
}

.navigation a {
    color: #ff8040;
    text-decoration: none;
    margin: 0 18px;
}

.navigation a:hover {
    text-decoration: underline;
}

/* Title */
.title {
    color: #ffff00;
    font-size: 22px;
    margin-bottom: 5px;
}

.subtitle {
    color: #ffff00;
    font-size: 14px;
    margin-bottom: 30px;
}

/* Exercise */
.exercise {
    margin: 0 auto;
    border-collapse: collapse;
}

.exercise td {
    padding: 8px 0;
    vertical-align: middle;
}

/* Extra space between the English expression and answer box */
.left {
    text-align: right;
    padding-right: 55px !important;
    white-space: nowrap;
}

.right {
    text-align: left;
    padding-left: 10px !important;
}

.answer {
    font-family: Arial, Geneva, sans-serif;
    font-size: 14px;
}

.mark {
    padding-left: 12px !important;
    text-align: left;
}

.check {
    padding-top: 25px !important;
}

button {
    font-family: Arial, Geneva, sans-serif;
    font-size: 14px;
    padding: 3px 12px;
}

select {
    font-family: Arial, Geneva, sans-serif;
    font-size: 14px;
}

.feedback {
    margin-top: 20px;
    color: #ff8040;
    font-size: 14px;
}
</style>

<script>
const items = [
    ["absence makes the heart grow fonder", "loin des yeux...près du coeur"],
    ["a bird in the hand is better than two in the bush", "un bon tiens vaut mieux que deux tu l'auras"],
    ["a friend in need is a friend indeed", "c'est dans le besoin qu'on reconnait ses amis"],
    ["all is well that ends well", "tout est bien qui finit bien"],
    ["birds of a feather flock together", "qui se ressemble s'assemble"],
    ["curiosity killed the cat", "la curiosité est un vilain défaut"],
    ["it never rains but it pours", "un malheur n'arrive jamais seul"],
    ["it's the last straw that breaks the camel's back", "c'est la goutte d'eau qui fait déborder le vase"],
    ["nothing ventured, nothing gained", "qui ne risque rien n'a rien"],
    ["no use crying over spilt milk", "ce qui est fait est fait"]
];

let answers = [];
let attempts = 0;

function shuffle(array) {
    let result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function startExercise() {

    answers = shuffle(
        items.map((item, index) => ({
            text: item[1],
            index: index
        }))
    );

    buildExercise();
}

function buildExercise() {

    const table = document.getElementById("exercise");

    table.innerHTML = "";

    items.forEach((item, index) => {

        const row = table.insertRow();

        const leftCell = row.insertCell();
        leftCell.className = "left";
        leftCell.innerHTML = item[0];

        const rightCell = row.insertCell();
        rightCell.className = "right";

        const select = document.createElement("select");
        select.className = "answer";
        select.id = "answer" + index;

        const firstOption = document.createElement("option");
        firstOption.value = "";
        firstOption.textContent = "???";
        select.appendChild(firstOption);

        answers.forEach(answer => {

            const option = document.createElement("option");

            option.value = answer.index;
            option.textContent = answer.text;

            select.appendChild(option);
        });

        rightCell.appendChild(select);

        const markCell = row.insertCell();
        markCell.className = "mark";
        markCell.id = "mark" + index;
    });

    const row = table.insertRow();

    const cell = row.insertCell();
    cell.colSpan = 3;
    cell.className = "check";

    const button = document.createElement("button");

    button.textContent = "Check";
    button.onclick = checkAnswers;

    cell.appendChild(button);
}

function checkAnswers() {

    attempts++;

    let correct = 0;

    items.forEach((item, index) => {

        const select = document.getElementById("answer" + index);
        const mark = document.getElementById("mark" + index);

        if (parseInt(select.value) === index) {

            correct++;
            mark.innerHTML = ":-)";

        } else {

            mark.innerHTML = "X";
        }
    });

    const score = Math.floor(
        (correct / items.length) * 100
    );

    const feedback = document.getElementById("feedback");

    if (correct === items.length) {

        feedback.innerHTML =
            "Correct! Well done.<br>Your score is " +
            score + "%.";

    } else {

        feedback.innerHTML =
            "Sorry! Try again.<br>Your score is " +
            score + "%.";
    }
}

window.onload = startExercise;
</script>

</head>

<body>

<div class="container">

    <div class="navigation">
        <a href="proverbs3.htm">←</a>
        <a href="../index.html">INDEX</a>
    </div>

    <div class="title">
        Proverbs & Expressions 4
    </div>

    <div class="subtitle">
        Matching exercise
    </div>

    <table id="exercise" class="exercise">
    </table>

    <div id="feedback" class="feedback">
    </div>

</div>

</body>
</html>
