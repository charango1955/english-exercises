<head>
<meta charset="UTF-8">
<title>Proverbs & Expressions 4</title>

<style>
body {
    background-color: #000000;
    color: #ff8040;
    font-family: Arial, Geneva, sans-serif;
    margin: 0;
    padding: 0;
}

#navigation {
    text-align: center;
    margin-top: 15px;
    margin-bottom: 25px;
    font-size: 16px;
}

#navigation a {
    color: #ff8040;
    text-decoration: none;
}

#navigation a:hover {
    color: #ffff00;
}

.nav-space {
    display: inline-block;
    width: 35px;
}

h1 {
    color: #ffff00;
    font-size: 22px;
    text-align: center;
    margin: 10px 0 5px 0;
}

.subtitle {
    color: #ffff00;
    font-size: 14px;
    text-align: center;
    margin-bottom: 25px;
}

.exercise {
    margin: 0 auto;
    width: 650px;
}

table {
    border-collapse: separate;
    border-spacing: 0 8px;
    margin: 0 auto;
}

td {
    vertical-align: middle;
}

.question {
    color: #ff8040;
    font-weight: bold;
    text-align: right;
    padding-right: 45px;
    white-space: nowrap;
}

.answer {
    text-align: left;
}

.answer select {
    font-size: 14px;
    min-width: 280px;
}

.mark {
    color: #ff8040;
    padding-left: 12px;
    font-weight: bold;
}

.check {
    text-align: center;
    padding-top: 18px;
}

.check input {
    font-size: 14px;
    padding: 3px 12px;
}

#feedback {
    text-align: center;
    color: #ff8040;
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 10px;
}
</style>

<script type="text/javascript">

var CorrectIndicator = ":-)";
var IncorrectIndicator = "X";

var CorrectResponse = "Correct! Well done.";
var IncorrectResponse = "Sorry! Try again. Incorrect matches have been removed.";

var I = [
    ["absence makes the heart grow fonder", "loin des yeux...près du coeur"],
    ["a bird in the hand is better than two in the bush", "un bon tiens vaut mieux que deux tu l'auras"],
    ["a friend in need is a friend indeed", "c'est dans le besoin qu'on reconnait ses amis"],
    ["all is well that ends well", "tout est bien qui finit bien"],
    ["birds of a feather flock together", "qui se ressemble s'assemble"],
    ["curiosity killed the cat", "la curiosité est un vilain défaut"],
    ["it never rains but it pours", "un malheur n'arrive jamais seul"],
    ["it's the last straw that breaks the camel's back", "c'est la goutte d'eau qui fait déborder le vase"],
    ["nothing ventured, nothing gained", "qui ne risque rien n'a rien"],
    ["no use crying over spilt milk", "ce qui est fait est fait"]
];

var RItems = [];
var Status = [];
var Penalties = 0;

function Shuffle(array) {
    var result = array.slice();

    for (var i = result.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = result[i];
        result[i] = result[j];
        result[j] = temp;
    }

    return result;
}

function StartUp() {

    RItems = [];

    for (var i = 0; i < I.length; i++) {
        RItems.push(I[i][1]);
        Status[i] = {
            correct: false,
            tried: false
        };
    }

    RItems = Shuffle(RItems);

    BuildExercise();
}

function BuildExercise() {

    var html = "";

    html += '<table>';

    for (var i = 0; i < I.length; i++) {

        html += '<tr>';

        html += '<td class="question">';
        html += I[i][0];
        html += '</td>';

        html += '<td class="answer">';

        if (Status[i].correct) {

            html += I[i][1];

        } else {

            html += '<select id="answer' + i + '">';
            html += '<option value="">???</option>';

            for (var j = 0; j < RItems.length; j++) {

                html += '<option value="' + escapeQuotes(RItems[j]) + '">';
                html += RItems[j];
                html += '</option>';
            }

            html += '</select>';
        }

        html += '</td>';

        html += '<td class="mark">';

        if (Status[i].tried) {

            if (Status[i].correct) {
                html += CorrectIndicator;
            } else {
                html += IncorrectIndicator;
            }
        }

        html += '</td>';

        html += '</tr>';
    }

    html += '<tr>';
    html += '<td colspan="3" class="check">';
    html += '<input type="button" value="Check" onclick="CheckAnswers()">';
    html += '</td>';
    html += '</tr>';

    html += '</table>';

    document.getElementById("exercise").innerHTML = html;
}

function escapeQuotes(text) {
    return text.replace(/"/g, "&quot;");
}

function CheckAnswers() {

    var totalCorrect = 0;
    var allDone = true;

    for (var i = 0; i < I.length; i++) {

        if (Status[i].correct) {
            totalCorrect++;
            continue;
        }

        var select = document.getElementById("answer" + i);

        if (!select) {
            continue;
        }

        Status[i].tried = true;

        if (select.value === I[i][1]) {
            Status[i].correct = true;
            totalCorrect++;
        } else {
            allDone = false;
        }
    }

    var score = Math.floor(
        ((totalCorrect - Penalties) / I.length) * 100
    );

    if (score < 0) {
        score = 0;
    }

    if (allDone) {

        document.getElementById("feedback").innerHTML =
            CorrectResponse + "<br>Your score is " + score + "%.";

    } else {

        document.getElementById("feedback").innerHTML =
            IncorrectResponse + "<br>Your score is " + score + "%.";

        Penalties++;
    }

    BuildExercise();
}

window.onload = StartUp;

</script>
</head>
