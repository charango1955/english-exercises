<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proverbs and Expressions 3 (with TO BE)</title>

<style>
body {
    background-color: #000000;
    color: #ff8040;
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
}

.navigation {
    text-align: center;
    margin-top: 15px;
    margin-bottom: 35px;
}

.navigation button {
    font-size: 14px;
    padding: 4px 10px;
    cursor: pointer;
}

.navigation .index {
    margin-left: 25px;
    margin-right: 25px;
}

.title {
    text-align: center;
    color: #ffff00;
    font-size: 22px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #ffff00;
    font-size: 14px;
    margin-bottom: 25px;
}

.exercise {
    width: fit-content;
    margin: 0 auto;
}

.exercise table {
    border-collapse: separate;
    border-spacing: 8px 6px;
}

.exercise td {
    vertical-align: top;
}

.left-item {
    color: #ff8040;
    text-align: right;
    padding-right: 10px;
    white-space: nowrap;
}

.answer {
    text-align: left;
    white-space: nowrap;
}

.mark {
    padding-left: 5px;
    white-space: nowrap;
}

.check {
    text-align: center;
    padding-top: 15px;
}

.feedback {
    text-align: center;
    color: #ff8040;
    font-size: 14px;
    margin-bottom: 15px;
}

select {
    font-size: 14px;
}

.check button {
    font-size: 14px;
    padding: 4px 12px;
    cursor: pointer;
}
</style>

<script type="text/javascript">

var I = [];

I[0] = [
    'as busy as a bee',
    '&#234;tre tr&#232;s occup&#233;'
];

I[1] = [
    'as cool as a cucumber',
    'garder son flegme'
];

I[2] = [
    'as fit as a fiddle',
    'en pleine forme'
];

I[3] = [
    'as good as gold',
    'sage comme une image'
];

I[4] = [
    'as happy as a king/lark',
    'heureux comme un roi'
];

I[5] = [
    'as pale as death',
    'p&#226;le comme la mort'
];

I[6] = [
    'as quick as lightning',
    'vif comme l\'&#233;clair'
];

I[7] = [
    'as proud as a peacock',
    'fier comme Artaban'
];

I[8] = [
    'as hungry as a horse',
    'avoir une faim de loup'
];

I[9] = [
    'as strong as an ox',
    'fort comme un turc'
];

var answers = [];
var status = [];
var penalties = 0;
var totalCorrect = 0;

function shuffle(array) {
    var result = array.slice();

    for (var i = result.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));

        var temp = result[i];
        result[i] = result[j];
        result[j] = temp;
    }

    return result;
}

function startExercise() {

    answers = [];

    for (var i = 0; i < I.length; i++) {
        answers.push(I[i][1]);
        status[i] = {
            correct: false,
            attempted: false
        };
    }

    answers = shuffle(answers);

    buildExercise();
}

function buildExercise() {

    var html = '';

    html += '<table>';

    for (var i = 0; i < I.length; i++) {

        html += '<tr>';

        html += '<td class="left-item">';
        html += I[i][0];
        html += '</td>';

        html += '<td class="answer">';

        if (status[i] && status[i].correct) {

            html += I[i][1];

        } else {

            html += '<select id="answer' + i + '">';
            html += '<option value="">???</option>';

            for (var j = 0; j < answers.length; j++) {

                html += '<option value="' +
                    escapeQuotes(answers[j]) +
                    '">' +
                    answers[j] +
                    '</option>';
            }

            html += '</select>';
        }

        html += '</td>';

        html += '<td class="mark">';

        if (status[i] && status[i].attempted) {

            if (status[i].correct) {
                html += ':-)';
            } else {
                html += 'X';
            }
        }

        html += '</td>';

        html += '</tr>';
    }

    html += '<tr>';
    html += '<td colspan="3" class="check">';
    html += '<button onclick="checkAnswers()">Check</button>';
    html += '</td>';
    html += '</tr>';

    html += '</table>';

    document.getElementById('exercise').innerHTML = html;
}

function escapeQuotes(text) {
    return text.replace(/"/g, '&quot;');
}

function checkAnswers() {

    var allDone = true;
    totalCorrect = 0;

    for (var i = 0; i < I.length; i++) {

        if (status[i].correct) {
            totalCorrect++;
            continue;
        }

        var select = document.getElementById('answer' + i);

        if (!select) {
            continue;
        }

        status[i].attempted = true;

        if (select.value === I[i][1]) {

            status[i].correct = true;
            totalCorrect++;

        } else {

            allDone = false;
        }
    }

    var score = Math.floor(
        ((totalCorrect - penalties) / I.length) * 100
    );

    if (score < 0) {
        score = 0;
    }

    var feedback = '';

    if (allDone) {

        feedback =
            'Correct! Well done.<br>Your score is ' +
            score +
            '%.';

    } else {

        feedback =
            'Sorry! Try again. Incorrect matches have been removed.<br>' +
            'Your score is ' +
            score +
            '%.';

        penalties++;
    }

    document.getElementById('feedback').innerHTML = feedback;

    buildExercise();
}

</script>
</head>

<body onload="startExercise()">

<!-- NAVIGATION -->
<div class="navigation">

    <button onclick="window.top.location.href='proverbs2.htm'">
        &lt;
    </button>

    <span class="index">
        <button onclick="window.top.location.href='../index.html'">
            INDEX
        </button>
    </span>

    <button onclick="window.top.location.href='proverbs4.htm'">
        &gt;
    </button>

</div>

<!-- TITLE -->
<div class="title">
    Proverbs and Expressions 3 (with TO BE)
</div>

<div class="subtitle">
    Matching exercise
</div>

<!-- FEEDBACK -->
<div id="feedback" class="feedback"></div>

<!-- EXERCISE -->
<div id="exercise" class="exercise"></div>

</body>
</html>
