<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proverbs and Expressions 3 (with TO BE)</title>

<style>
body {
    background-color: #000000;
    color: #ff8040;
    font-family: Arial, Geneva, sans-serif;
    margin: 0;
    padding: 0;
}

.container {
    width: 85%;
    margin: 0 auto;
    text-align: center;
}

/* Navigation */
.navigation {
    padding-top: 15px;
    padding-bottom: 25px;
    font-size: 14px;
}

.navigation a {
    color: #ff8040;
    text-decoration: none;
    margin: 0 18px;
}

.navigation a:hover {
    text-decoration: underline;
}

/* Title */
.title {
    color: #ffff00;
    font-size: 22px;
    margin-bottom: 5px;
}

.subtitle {
    color: #ffff00;
    font-size: 14px;
    margin-bottom: 30px;
}

/* Exercise */
.exercise {
    margin: 0 auto;
    border-collapse: collapse;
}

.exercise td {
    padding: 8px 0;
    vertical-align: middle;
}

.left {
    text-align: right;
    padding-right: 35px !important;
    white-space: nowrap;
}

.right {
    text-align: left;
    padding-left: 10px !important;
}

.answer {
    font-family: Arial, Geneva, sans-serif;
}

.mark {
    padding-left: 12px !important;
    text-align: left;
}

.check {
    padding-top: 25px !important;
}

button {
    font-family: Arial, Geneva, sans-serif;
    font-size: 14px;
    padding: 3px 12px;
}

select {
    font-family: Arial, Geneva, sans-serif;
    font-size: 14px;
}

.feedback {
    margin-top: 20px;
    color: #ff8040;
    font-size: 14px;
}
</style>

<script>
const items = [
    ["as busy as a bee", "être très occupé"],
    ["as cool as a cucumber", "garder son flegme"],
    ["as fit as a fiddle", "en pleine forme"],
    ["as good as gold", "sage comme une image"],
    ["as happy as a king/lark", "heureux comme un roi"],
    ["as pale as death", "pâle comme la mort"],
    ["as quick as lightning", "vif comme l'éclair"],
    ["as proud as a peacock", "fier comme Artaban"],
    ["as hungry as a horse", "avoir une faim de loup"],
    ["as strong as an ox", "fort comme un turc"]
];

let answers = [];
let attempts = 0;

function shuffle(array) {
    let result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function startExercise() {
    answers = shuffle(items.map((item, index) => ({
        text: item[1],
        index: index
    })));

    buildExercise();
}

function buildExercise() {
    const table = document.getElementById("exercise");

    table.innerHTML = "";

    items.forEach((item, index) => {

        const row = table.insertRow();

        const leftCell = row.insertCell();
        leftCell.className = "left";
        leftCell.innerHTML = item[0];

        const rightCell = row.insertCell();
        rightCell.className = "right";

        const select = document.createElement("select");
        select.className = "answer";
        select.id = "answer" + index;

        const firstOption = document.createElement("option");
        firstOption.value = "";
        firstOption.textContent = "???";
        select.appendChild(firstOption);

        answers.forEach(answer => {
            const option = document.createElement("option");
            option.value = answer.index;
            option.textContent = answer.text;
            select.appendChild(option);
        });

        rightCell.appendChild(select);

        const markCell = row.insertCell();
        markCell.className = "mark";
        markCell.id = "mark" + index;
    });

    const row = table.insertRow();
    const cell = row.insertCell();
    cell.colSpan = 3;
    cell.className = "check";

    const button = document.createElement("button");
    button.textContent = "Check";
    button.onclick = checkAnswers;

    cell.appendChild(button);
}

function checkAnswers() {

    attempts++;

    let correct = 0;

    items.forEach((item, index) => {

        const select = document.getElementById("answer" + index);
        const mark = document.getElementById("mark" + index);

        if (parseInt(select.value) === index) {
            correct++;
            mark.innerHTML = ":-)";
        } else {
            mark.innerHTML = "X";
        }
    });

    const score = Math.floor((correct / items.length) * 100);

    const feedback = document.getElementById("feedback");

    if (correct === items.length) {
        feedback.innerHTML =
            "Correct! Well done.<br>Your score is " + score + "%.";
    } else {
        feedback.innerHTML =
            "Sorry! Try again.<br>Your score is " + score + "%.";
    }
}

window.onload = startExercise;
</script>

</head>

<body>

<div class="container">

    <div class="navigation">
        <a href="proverbs2.htm">←</a>
        <a href="../index.html">INDEX</a>
        <a href="proverbs4.htm">→</a>
    </div>

    <div class="title">
        Proverbs and Expressions 3 (with TO BE)
    </div>

    <div class="subtitle">
        Matching exercise
    </div>

    <table id="exercise" class="exercise">
    </table>

    <div id="feedback" class="feedback">
    </div>

</div>

</body>
</html>
