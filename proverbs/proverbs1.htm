<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proverbs & Expressions 1</title>

<style>
body {
    background-color: #000000;
    color: #ff8040;
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
}

.navigation {
    text-align: center;
    margin-top: 15px;
    margin-bottom: 40px;
}

.navigation button {
    background-color: #000000;
    color: #ff8040;
    border: 1px solid #ff8040;
    font-size: 14px;
    padding: 4px 12px;
    cursor: pointer;
}

.navigation button:hover {
    background-color: #ff8040;
    color: #000000;
}

.navigation .index {
    margin-left: 25px;
    margin-right: 25px;
}

.title {
    text-align: center;
    color: #ffff00;
    font-size: 22px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #ffff00;
    font-size: 14px;
    margin-bottom: 30px;
}

.feedback {
    text-align: center;
    color: #ff8040;
    font-size: 14px;
    margin-bottom: 15px;
}

.exercise {
    width: fit-content;
    margin: 0 auto;
}

.exercise table {
    border-collapse: separate;
    border-spacing: 8px 6px;
}

.exercise td {
    vertical-align: top;
}

.left-item {
    color: #ff8040;
    text-align: right;
    padding-right: 20px;
    white-space: nowrap;
}

.answer {
    text-align: left;
    white-space: nowrap;
}

.mark {
    padding-left: 5px;
    white-space: nowrap;
}

.check {
    text-align: center;
    padding-top: 15px;
}

.check button {
    font-size: 14px;
    padding: 4px 12px;
    cursor: pointer;
}
</style>

<script>
var I = [
    ['a blessing in disguise', 'un mal pour un bien'],
    ['a piece of cake', 'très facile'],
    ['actions speak louder than words', 'les actes valent mieux que les paroles'],
    ['better late than never', 'mieux vaut tard que jamais'],
    ['every cloud has a silver lining', 'à quelque chose malheur est bon'],
    ['to kill two birds with one stone', 'faire d’une pierre deux coups'],
    ['once in a blue moon', 'très rarement'],
    ['the early bird catches the worm', 'le monde appartient à ceux qui se lèvent tôt'],
    ['when pigs fly', 'quand les poules auront des dents'],
    ['you can’t judge a book by its cover', 'l’habit ne fait pas le moine']
];

var answers = [];
var status = [];
var penalties = 0;
var totalCorrect = 0;

function shuffle(array) {
    var result = array.slice();

    for (var i = result.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = result[i];
        result[i] = result[j];
        result[j] = temp;
    }

    return result;
}

function startExercise() {
    answers = [];

    for (var i = 0; i < I.length; i++) {
        answers.push(I[i][1]);
        status[i] = {
            correct: false,
            attempted: false
        };
    }

    answers = shuffle(answers);
    buildExercise();
}

function buildExercise() {
    var html = '<table>';

    for (var i = 0; i < I.length; i++) {

        html += '<tr>';

        html += '<td class="left-item">';
        html += I[i][0];
        html += '</td>';

        html += '<td class="answer">';

        if (status[i].correct) {

            html += I[i][1];

        } else {

            html += '<select id="answer' + i + '">';
            html += '<option value="">???</option>';

            for (var j = 0; j < answers.length; j++) {
                html += '<option value="' + escapeQuotes(answers[j]) + '">';
                html += answers[j];
                html += '</option>';
            }

            html += '</select>';
        }

        html += '</td>';

        html += '<td class="mark">';

        if (status[i].attempted) {
            html += status[i].correct ? ':-)' : 'X';
        }

        html += '</td>';
        html += '</tr>';
    }

    html += '<tr>';
    html += '<td colspan="3" class="check">';
    html += '<button onclick="checkAnswers()">Check</button>';
    html += '</td>';
    html += '</tr>';

    html += '</table>';

    document.getElementById('exercise').innerHTML = html;
}

function escapeQuotes(text) {
    return text.replace(/"/g, '&quot;');
}

function checkAnswers() {
    var allDone = true;
    totalCorrect = 0;

    for (var i = 0; i < I.length; i++) {

        if (status[i].correct) {
            totalCorrect++;
            continue;
        }

        var select = document.getElementById('answer' + i);

        if (!select) continue;

        status[i].attempted = true;

        if (select.value === I[i][1]) {
            status[i].correct = true;
            totalCorrect++;
        } else {
            allDone = false;
        }
    }

    var score = Math.floor(
        ((totalCorrect - penalties) / I.length) * 100
    );

    if (score < 0) score = 0;

    if (allDone) {
        document.getElementById('feedback').innerHTML =
            'Correct! Well done.<br>Your score is ' + score + '%.';
    } else {
        document.getElementById('feedback').innerHTML =
            'Sorry! Try again.<br>Your score is ' + score + '%.';
        penalties++;
    }

    buildExercise();
}
</script>
</head>

<body onload="startExercise()">

<div class="navigation">
    <button onclick="window.location.href='proverbs4.htm'">&lt;</button>

    <span class="index">
        <button onclick="window.location.href='../index.html'">INDEX</button>
    </span>

    <button onclick="window.location.href='proverbs2.htm'">&gt;</button>
</div>

<div class="title">
    Proverbs & Expressions 1
</div>

<div class="subtitle">
    Matching exercise
</div>

<div id="feedback" class="feedback"></div>

<div id="exercise" class="exercise"></div>

</body>
</html>
