<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proverbs & Expressions 1</title>

<style>
body {
    background-color: #000000;
    color: #FF8040;
    font-family: Arial, sans-serif;
    font-size: 14px;
    margin: 20px;
}

.navigation {
    text-align: left;
    margin-bottom: 30px;
}

.navigation a {
    color: #FFFF00;
    text-decoration: none;
    font-size: 26px;
    font-weight: bold;
    margin-right: 45px;
}

.navigation a:hover {
    color: #FF8040;
}

h1 {
    color: #FFFF00;
    font-size: 22px;
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    color: #FFFF00;
    font-size: 14px;
    font-weight: bold;
    font-style: italic;
    text-align: center;
    margin-bottom: 25px;
}

.exercise {
    width: 85%;
    margin: 0 auto;
}

.exercise table {
    border-collapse: collapse;
    width: 100%;
}

.exercise td {
    padding: 8px;
    color: #FF8040;
    vertical-align: top;
}

select {
    background-color: #FFFFCC;
    color: #000000;
    font-size: 14px;
}

.check {
    text-align: center;
    padding-top: 20px;
}

.check input {
    background-color: #FF8040;
    color: #000000;
    border: 2px solid #FFFF00;
    padding: 6px 18px;
    font-weight: bold;
    cursor: pointer;
}

.check input:hover {
    background-color: #FFFF00;
}

#feedback {
    color: #FFFF00;
    font-weight: bold;
    text-align: center;
    margin-top: 20px;
}
</style>

<script>

var I = [];

I[0] = ["to update", "mettre à jour"];
I[1] = ["to cross one's fingers", "croiser les doigts"];
I[2] = ["to keep body & soul together", "survivre"];
I[3] = ["to keep oneself to oneself", "être replié sur soi"];
I[4] = ["to beat about the bush", "tourner autour du pot"];
I[5] = ["to keep up appearances", "sauver les apparences"];
I[6] = ["to keep a straight face", "rester impassible"];
I[7] = ["to keep up with the Joneses", "rivaliser avec son voisin"];
I[8] = ["to keep a stiff upper lip", "garder son sang froid"];
I[9] = ["to kill two birds with one stone", "faire d'une pierre deux coups"];

var answers = [];
var choices = [];
var penalties = 0;

function shuffle(array) {
    var copy = array.slice();

    for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
    }

    return copy;
}

function StartUp() {

    choices = [];

    for (var i = 0; i < I.length; i++) {
        choices.push(I[i][1]);
    }

    choices = shuffle(choices);

    BuildExercise();
}

function BuildExercise() {

    var html = '<table>';

    for (var i = 0; i < I.length; i++) {

        html += '<tr>';

        html += '<td>';
        html += I[i][0];
        html += '</td>';

        html += '<td>';

        html += '<select id="answer' + i + '">';
        html += '<option value="">???</option>';

        for (var j = 0; j < choices.length; j++) {

            html += '<option value="' +
                    escapeHTML(choices[j]) +
                    '">' +
                    escapeHTML(choices[j]) +
                    '</option>';
        }

        html += '</select>';

        html += '</td>';

        html += '</tr>';
    }

    html += '</table>';

    document.getElementById("exercise").innerHTML = html;
}

function CheckAnswers() {

    var correct = 0;

    for (var i = 0; i < I.length; i++) {

        var select = document.getElementById("answer" + i);
        var answer = select.value;

        if (answer === I[i][1]) {
            correct++;
        } else {
            select.value = "";
        }
    }

    var score = Math.floor((correct / I.length) * 100);

    if (correct === I.length) {

        document.getElementById("feedback").innerHTML =
            "Correct! Well done. Your score is " + score + "%.";

    } else {

        penalties++;

        document.getElementById("feedback").innerHTML =
            "Sorry! Try again. Incorrect matches have been removed. " +
            "Your score is " + score + "%.";
    }
}

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</head>

<body onload="StartUp()">

<!-- NAVIGATION -->

<div class="navigation">

    <a href="../index.html">INDEX</a>

    <a href="proverbs2.htm">→</a>

</div>


<!-- TITLE -->

<h1>Proverbs &amp; Expressions 1</h1>

<div class="subtitle">
Matching exercise
</div>


<!-- EXERCISE -->

<div class="exercise">

    <div id="exercise"></div>

    <div class="check">

        <input type="button"
               value="Check"
               onclick="CheckAnswers()">

    </div>

    <div id="feedback"></div>

</div>

</body>
</html>
